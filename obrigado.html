<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contagie · Recebemos o seu contato</title>
<meta name="description" content="Confirmação de recebimento do contato enviado à equipe da Contagie.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/marca/icone-180.png">
<link rel="preload" href="assets/fontes/hanken-grotesk-variavel.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/estilo.css">

<body>

<!-- Página mostrada pelo Netlify depois do envio do formulário sem JavaScript (action="/obrigado.html" no index.html). -->
<header class="cabecalho">
  <div class="recipiente cabecalho__interno">
    <a class="marca" href="index.html">
      <img src="assets/marca/contagie-logotipo-reduzido.webp" width="360" height="120" alt="Contagie, voltar à página inicial">
    </a>
  </div>
</header>

<main id="conteudo" class="secao obrigado">
  <div class="recipiente grade">
    <p class="rotulo secao__rotulo">Contato</p>
    <div class="secao__cabeca">
      <h1 class="texto-titulo">Recebemos o seu contato<span class="ponto" aria-hidden="true"></span><span class="oculto">.</span></h1>
      <!-- PENDENTE: quando o cliente informar o prazo real de retorno (por exemplo "em até um dia útil"), incluí-lo na frase abaixo. -->
      <p class="texto-destaque">Obrigado por escrever. Nossa equipe vai falar com você pelo WhatsApp para agendar uma conversa sobre a realidade da sua rede.</p>
      <p><a class="link link--seta" href="index.html">Voltar à página inicial<svg class="icone" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h15M13.5 6.5 19 12l-5.5 5.5"/></svg></a></p>
    </div>
  </div>
</main>

<footer class="rodape">
  <div class="recipiente">
    <p>Contagie · Sistema Contagie de Aprendizagem · Sede em Londrina, Paraná</p>
  </div>
</footer>

</body>
</html>
